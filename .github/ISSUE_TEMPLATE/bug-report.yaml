name: Bug report | 问题反馈
description: Report unexpected behavior in an existing feature | 报告已有功能异常
title: "[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Report one bug per issue. For new features or improvements, use the Feature request template.
        每条反馈只描述一个问题；新增或改进功能请使用“功能建议”模板。
        Reports are public. Do not include keys, passwords, settings links/QR codes, private books or personal information.
        反馈公开可见。请勿提交密钥、密码、设置链接/二维码、私人书籍或个人信息。
  - type: checkboxes
    id: bug_report_is_crash
    attributes:
      label: Prerequisites|前提条件
      options:
        - label: I have reviewed this report and removed private information|我已检查反馈内容并移除私人信息
          required: true
        - label: I have searched for similar issues and did not find any|我已经搜索过没有相同的问题
          required: true
  - type: textarea
    id: bug_report_description
    attributes:
      label: Describe the bug|描述问题
      description: |
        Describe the problem and the actual result, including any error message.
        描述问题和实际结果，包括报错信息（如有）。
    validations:
      required: true
  - type: textarea
    id: bug_report_reproduce
    attributes:
      label: To reproduce|重现步骤
      description: |
        List the steps in order. If intermittent, describe what happened before the error and how often it occurs.
        按顺序列出操作；无法稳定复现时，说明出错前的操作与发生频率。
      value: |
        1. Go to '...' | 前往...
        2. Click on '...' | 点击...
        3. Scroll down to '...' | 向下滚动到...
        4. See error | 看到错误
    validations:
      required: true
  - type: textarea
    id: bug_report_expected_behavior
    attributes:
      label: Expected behavior|预期行为
      description: |
        A clear and concise description of what you expected to happen
        一个清晰且简洁的描述你期望发生的事情
    validations:
      required: true
  - type: textarea
    id: bug_report_screenshots
    attributes:
      label: Screenshots|截图
      description: |
        If applicable, add screenshots to help explain your problem
        Tip: You can attach images by clicking this area to highlight it and then dragging files in.
        如果可以，添加截图以帮助解释问题
        提示：你可以通过点击此区域来高亮它，然后拖动文件来添加图片。
  - type: textarea
    id: bug_report_desktop
    attributes:
      label: Platform (please complete the following information)|平台（请填写以下信息）
      value: |
        - Platform: | 平台：
          [e.g. Android]
        - OS: | 操作系统：
          [e.g. Android13(MIUI14)]
        - Modu Version: | 默读版本：
          [e.g. 1.2.0+10082]
        - Device: | 设备：
          [e.g. Xiaomi 13]
    validations:
      required: true
  - type: textarea
    id: bug_report_additional_context
    attributes:
      label: Additional context|其他信息
      description: |
        Add any other context about the problem here, e.g. logs
        添加任何其他关于问题的信息，如日志等
