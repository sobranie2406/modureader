name: AppImage Ubuntu sandbox preflight
on: [push]
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    timeout-minutes: 8
    steps:
      - name: Install the Ubuntu sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap xdg-dbus-proxy
      - name: Check distro and sandbox operations
        run: |
          cat /etc/os-release
          cat /sys/module/apparmor/parameters/enabled
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          sudo aa-status | rg -i 'bwrap|webkit' || true
          /usr/bin/bwrap --unshare-net --ro-bind / / --proc /proc --dev /dev /usr/bin/true
