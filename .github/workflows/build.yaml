name: Modu Packages

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'all or comma-separated targets (linux-x64,linux-arm64,windows-x64,windows-arm64,macos-x64,macos-arm64,android,ios)'
        default: all
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: modu-packages-${{ github.ref }}-${{ github.sha }}-${{ inputs.targets || 'all' }}
  cancel-in-progress: false

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      desktop: ${{ steps.matrix.outputs.desktop }}
      has_desktop: ${{ steps.matrix.outputs.has_desktop }}
      android: ${{ steps.matrix.outputs.android }}
      ios: ${{ steps.matrix.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          MODU_BUILD_TARGETS: ${{ inputs.targets || 'all' }}
        run: node scripts/release/matrix.mjs

  quality:
    uses: ./.github/workflows/pr-check.yml

  desktop:
    needs: targets
    if: needs.targets.outputs.has_desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.desktop) }}
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Debian base tools
        if: matrix.platform == 'linux'
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git unzip xz-utils zip sudo python3 python-is-python3 desktop-file-utils patchelf
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: matrix.platform != 'linux'
        with:
          python-version: '3.12'
      - name: Linux native dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libwpewebkit-2.0-dev libwpebackend-fdo-1.0-dev libwpe-1.0-dev libepoxy-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libasound2-dev libpulse-dev libsqlite3-dev
      - uses: NuGet/setup-nuget@v2
        if: matrix.platform == 'windows'
      - name: Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup default stable
          if [[ "${{ matrix.platform }}-${{ matrix.arch }}" == "windows-arm64" ]]; then
            rustup target add aarch64-pc-windows-msvc
          fi
      - uses: subosito/flutter-action@v2
        if: matrix.platform != 'linux'
        with:
          flutter-version: '3.47.2'
          architecture: ${{ matrix.sdk_arch || runner.arch }}
          channel: stable
          cache: true
      - name: Linux Flutter source SDK (native x64 or ARM64 Dart)
        if: matrix.platform == 'linux'
        run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/modu-flutter"
          echo "$RUNNER_TEMP/modu-flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Windows ARM64 SDK host detection compatibility
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        run: node scripts/release/windows-arm64-sdk.mjs
      - name: Prepare sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          npm ci --prefix assets/foliate-js
          (cd assets/foliate-js && node node_modules/webpack-cli/bin/cli.js --config webpack.config.js)
      - name: Build desktop
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '3'
          FLUTTER_XCODE_ARCHS: ${{ matrix.xcode_arch }}
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: 'YES'
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: '-'
        run: |
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            flutter build macos --release
          elif [[ "${{ matrix.platform }}" == "windows" ]]; then
            flutter build windows --release
          else
            flutter build ${{ matrix.platform }} --release --target-platform ${{ matrix.platform }}-${{ matrix.arch }}
          fi
      - name: Install pinned Inno Setup compiler
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/release/setup-inno.ps1
      - name: Verify architecture and package
        run: python scripts/release/package.py ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: modu-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-release/*.dmg
            dist-release/*.exe
            dist-release/*.deb
            dist-release/*.sha256
          if-no-files-found: error
          retention-days: 14

  android:
    needs: targets
    if: needs.targets.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Prepare sources and Rust mobile targets
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          npm ci --prefix assets/foliate-js
          (cd assets/foliate-js && node node_modules/webpack-cli/bin/cli.js --config webpack.config.js)
      - name: Load dedicated release signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: node scripts/release/android-signing.mjs --from-env
      - name: Build signed APKs
        run: flutter build apk --release --target-platform android-arm64,android-x64 --split-per-abi
      - name: Verify signatures and package
        run: |
          python3 scripts/release/package.py android arm64
          python3 scripts/release/package.py android x64
      - uses: actions/upload-artifact@v4
        with:
          name: modu-android
          path: |
            dist-release/*.apk
            dist-release/*.zip
            dist-release/*.sha256
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: targets
    if: needs.targets.outputs.ios == 'true'
    name: ios-arm64-UNSIGNED
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Prepare sources and Rust iOS target
        run: |
          rustup target add aarch64-apple-ios
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          npm ci --prefix assets/foliate-js
          (cd assets/foliate-js && node node_modules/webpack-cli/bin/cli.js --config webpack.config.js)
      - name: Build unsigned device application
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA (requires user's own signing)
        run: python3 scripts/release/package.py ios arm64
      - uses: actions/upload-artifact@v4
        with:
          name: modu-ios-arm64-unsigned
          path: |
            dist-release/*.ipa
            dist-release/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [quality, desktop, android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: modu-*
          path: dist-release
          merge-multiple: true
      - name: Verify package checksums and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd dist-release && sha256sum --check *.sha256)
          gh release create "$RELEASE_TAG" dist-release/* --verify-tag --prerelease --title "默读 $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
