name: Modu Packages

on:
  workflow_dispatch:
    inputs:
      reader_diagnostic:
        description: 'Only run the isolated Windows reader diagnostic (no packages or release)'
        default: false
        type: boolean
      appimage_smoke_run_id:
        description: 'Test the AppImage from this repository workflow run ID'
        default: ''
        type: string
      targets:
        description: 'all or comma-separated targets (linux-x64,linux-arm64,windows-x64,windows-arm64,macos-x64,macos-arm64,android,ios,harmony)'
        default: all
        type: string
      release_tag:
        description: 'Optional version tag to publish only after all packages pass (for example v1.0.4)'
        default: ''
        type: string
      replace_release:
        description: 'Explicitly replace this existing release after all packages pass'
        default: false
        type: boolean
      expected_tag_commit:
        description: 'Required full prior commit SHA when replacing a release; prevents overwriting an unexpected tag'
        default: ''
        type: string
  push:
    branches: ['verify/ubuntu-appimage-build-20261125003109']

permissions:
  contents: read

concurrency:
  group: modu-packages-${{ github.ref }}-${{ github.sha }}-${{ inputs.appimage_smoke_run_id || inputs.targets || 'all' }}
  cancel-in-progress: false

jobs:
  reader_diagnostic:
    if: inputs.reader_diagnostic == true && !inputs.appimage_smoke_run_id
    uses: ./.github/workflows/windows-reader-diagnostic.yml
  targets:
    if: inputs.reader_diagnostic != true && !inputs.appimage_smoke_run_id
    runs-on: ubuntu-24.04
    outputs:
      desktop: ${{ steps.matrix.outputs.desktop }}
      has_desktop: ${{ steps.matrix.outputs.has_desktop }}
      linux_appimage: ${{ steps.matrix.outputs.linux_appimage }}
      android: ${{ steps.matrix.outputs.android }}
      ios: ${{ steps.matrix.outputs.ios }}
      harmony: ${{ steps.matrix.outputs.harmony }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          echo 'has_desktop=true' >> "$GITHUB_OUTPUT"
          echo 'linux_appimage=true' >> "$GITHUB_OUTPUT"
          echo 'desktop=[{"os":"ubuntu-24.04","platform":"linux","arch":"x64","container":"ubuntu:24.04","appimage":true}]' >> "$GITHUB_OUTPUT"
          printf '%s\n' android=false ios=false harmony=false >> "$GITHUB_OUTPUT"

  quality:
    if: github.event_name == 'workflow_dispatch' && inputs.reader_diagnostic != true && !inputs.appimage_smoke_run_id
    uses: ./.github/workflows/pr-check.yml

  models:
    if: inputs.reader_diagnostic != true && !inputs.appimage_smoke_run_id
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/model-test-fixtures
          key: model-test-fixtures-${{ hashFiles('assets/models/embeddings/manifest.json') }}
      - name: Fetch and verify four pinned native-test fixtures (not app assets)
        run: python3 scripts/release/bundle_models.py
      - uses: actions/upload-artifact@v4
        with:
          name: embedding-test-fixtures
          path: build/model-test-fixtures/
          if-no-files-found: error
          retention-days: 7

  desktop:
    needs: [targets, models]
    if: needs.targets.outputs.has_desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.desktop) }}
    name: ${{ matrix.appimage && 'linux-x64-appimage' || format('{0}-{1}', matrix.platform, matrix.arch) }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: ${{ matrix.appimage && 300 || 90 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Debian base tools
        if: matrix.platform == 'linux' && matrix.appimage != true
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git unzip xz-utils zip sudo python3 python-is-python3 desktop-file-utils patchelf
      - name: Ubuntu 24.04 AppImage build dependencies
        if: matrix.appimage == true
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang clang-18 lld-18 cmake ninja-build pkg-config ccache bison flex gperf ruby perl \
            ca-certificates curl git unzip xz-utils zip python3 python-is-python3 python3-packaging \
            gettext unifdef bubblewrap xdg-dbus-proxy desktop-file-utils patchelf squashfs-tools \
            libseccomp-dev libglib2.0-dev libharfbuzz-dev libicu-dev libjpeg-dev libepoxy-dev \
            libgcrypt20-dev libsoup-3.0-dev libtasn1-6-dev libxkbcommon-dev libxml2-dev \
            libxml2-utils libpng-dev libsqlite3-dev libwebp-dev zlib1g-dev libfreetype-dev libwoff-dev libxslt1-dev \
            libatk1.0-dev libatk-bridge2.0-dev libatspi2.0-dev flite1-dev libjxl-dev libhyphen-dev \
            libavif-dev libsystemd-dev liblcms2-dev libenchant-2-dev libdrm-dev libgbm-dev \
            libwayland-dev wayland-protocols libmanette-0.2-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libasound2-dev libpulse-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: actions/checkout@v4
        with:
          ref: 83e39a7989801d59d30c4a958c7b205931a8c14e
      - uses: actions/download-artifact@v4
        with:
          name: embedding-test-fixtures
          path: build/model-test-fixtures
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: matrix.platform != 'linux'
        with:
          python-version: '3.12'
      - name: Verify native-test fixtures (never install in app assets)
        run: python scripts/release/bundle_models.py --verify-only
      - name: Linux native dependencies
        if: matrix.platform == 'linux' && matrix.appimage != true
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libwpewebkit-2.0-dev libwpebackend-fdo-1.0-dev libwpe-1.0-dev libepoxy-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libasound2-dev libpulse-dev libsqlite3-dev
      - uses: NuGet/setup-nuget@v2
        if: matrix.platform == 'windows'
      - name: Verify Windows redistributable toolchain before compilation
        # Resolve packaging compatibility before spending time compiling Flutter.
        if: matrix.platform == 'windows'
        run: python scripts/release/windows_runtime.py ${{ matrix.arch }}
      - name: Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup default stable
          if [[ "${{ matrix.platform }}-${{ matrix.arch }}" == "windows-arm64" ]]; then
            rustup target add aarch64-pc-windows-msvc
          fi
      - uses: subosito/flutter-action@v2
        if: matrix.platform != 'linux'
        with:
          flutter-version: '3.47.2'
          architecture: ${{ matrix.sdk_arch || runner.arch }}
          channel: stable
          cache: true
      - name: Linux Flutter source SDK (native x64 or ARM64 Dart)
        if: matrix.platform == 'linux'
        run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/modu-flutter"
          echo "$RUNNER_TEMP/modu-flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Windows ARM64 SDK host detection compatibility
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        run: node scripts/release/windows-arm64-sdk.mjs
      - name: Prepare sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          npm ci --prefix assets/foliate-js
          (cd assets/foliate-js && node node_modules/webpack-cli/bin/cli.js --config webpack.config.js)
      - name: Cache the Ubuntu AppImage WebKit build
        if: matrix.appimage == true
        id: appimage-webkit
        uses: actions/cache/restore@v4
        with:
          path: /opt/modu-wpe
          key: appimage-wpe-ubuntu24-x64-${{ hashFiles('scripts/release/build_appimage_wpe.py', 'scripts/release/*appimage*.patch') }}
      - name: Build the pinned WebKit runtime on Ubuntu 24.04
        if: matrix.appimage == true && steps.appimage-webkit.outputs.cache-hit != 'true'
        env:
          CC: clang-18
          CXX: clang++-18
        run: python scripts/release/build_appimage_wpe.py /opt/modu-wpe --jobs 3
      - name: Save the verified WebKit build
        if: matrix.appimage == true && steps.appimage-webkit.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/modu-wpe
          key: ${{ steps.appimage-webkit.outputs.cache-primary-key }}
      - name: Use the same WPE runtime for building and packaging the AppImage
        if: matrix.appimage == true
        run: |
          export PKG_CONFIG_PATH=/opt/modu-wpe/lib/pkgconfig
          pkg-config --exists wpe-webkit-2.0 wpe-platform-2.0 wpe-platform-headless-2.0
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "MODU_APPIMAGE_WPE_PREFIX=/opt/modu-wpe" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/modu-wpe/lib" >> "$GITHUB_ENV"
          python3 scripts/release/prepare_appimage_webview.py
      - name: Verify downloaded model native inference on macOS
        if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build/model-test-fixtures &
          fixture_server_pid=$!
          trap 'kill "$fixture_server_pid"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:8765/ > /dev/null
          flutter test integration_test/bundled_embedding_test.dart -d macos --dart-define=MODU_MODEL_TEST_URL=http://127.0.0.1:8765/ --reporter expanded
      - name: Verify Apple native crash summary privacy
        if: matrix.platform == 'macos'
        run: |
          swiftc third_party/modu_native_crash/darwin/Classes/NativeCrashSummary.swift test/native/AppleCrashSummaryTest.swift -o "$RUNNER_TEMP/modu-crash-summary-test"
          "$RUNNER_TEMP/modu-crash-summary-test"
      - name: Verify macOS brightness preserves native input
        if: matrix.platform == 'macos'
        run: |
          swiftc macos/Runner/WindowBrightness.swift test/native/WindowBrightnessTest.swift -o "$RUNNER_TEMP/modu-brightness-test"
          "$RUNNER_TEMP/modu-brightness-test"
      - name: Verify Windows native crash capture in isolated CI account
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -property installationPath
          $devcmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          cmd /c "`"$devcmd`" -arch=${{ matrix.arch }} -host_arch=x64 && cl /std:c++17 /EHsc /W4 /WX /wd4100 /DUNICODE /D_UNICODE /DFLUTTER_VERSION_BUILD=6331 test\native\WindowsCrashRecorderTest.cpp windows\runner\native_crash_recorder.cpp /Fe:modu-crash-test.exe /link dbghelp.lib shell32.lib ole32.lib && modu-crash-test.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build desktop
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '3'
          FLUTTER_XCODE_ARCHS: ${{ matrix.xcode_arch }}
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: 'YES'
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: '-'
        run: |
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            flutter build macos --release --build-name "$(python scripts/release/verify_mobile.py --apple-build-name)"
          elif [[ "${{ matrix.platform }}" == "windows" ]]; then
            flutter build windows --release
          else
            flutter build ${{ matrix.platform }} --release --target-platform ${{ matrix.platform }}-${{ matrix.arch }}
          fi
      - name: Install pinned Inno Setup compiler
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/release/setup-inno.ps1
      - name: Retain Windows symbols separately (not in the installer)
        if: always() && matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-symbols-${{ matrix.arch }}-${{ github.sha }}
          path: |
            build/windows/**/Release/*.pdb
            build/windows/**/Release/modu.exe
            build/windows/**/Release/flutter_windows.dll
          if-no-files-found: error
          retention-days: 90
      - name: Native Windows reader extraction regression
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        run: flutter test integration_test/windows_reader_extraction_test.dart -d windows --dart-define=MODU_WINDOWS_READER_TEST=true --reporter expanded
      - name: Native Windows null callback regression
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        shell: pwsh
        run: ./scripts/release/test-windows-js-callback.ps1
      - name: Native Windows on-demand models offline inference
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory build/model-test-fixtures &
          fixture_server_pid=$!
          trap 'kill "$fixture_server_pid"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:8765/ > /dev/null
          flutter test integration_test/bundled_embedding_test.dart -d windows --dart-define=MODU_MODEL_TEST_URL=http://127.0.0.1:8765/ --reporter expanded
      - name: Verify architecture and package AppImage
        if: matrix.appimage == true
        run: |
          export MODU_APPIMAGE_RUNTIME="$RUNNER_TEMP/modu-appimage-runtime"
          python3 scripts/release/fetch_appimage_runtime.py "$MODU_APPIMAGE_RUNTIME"
          python3 scripts/release/package.py linux x64 --appimage
      - name: Report AppImage configuration errors
        if: failure() && matrix.appimage == true
        run: |
          find build/linux -name CMakeConfigureLog.yaml -exec grep -A 18 -B 3 -E 'WEBKIT_HAS_WPE_PLATFORM_API|fatal error|cannot find -l' {} + || true
      - name: Verify architecture and package
        if: matrix.appimage != true
        run: python scripts/release/package.py ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Verify Windows installation and uninstallation
        if: matrix.platform == 'windows'
        run: python scripts/release/verify_windows_install.py dist-release/*-setup.exe ${{ matrix.arch }}
      - name: Verify installed Debian package dependencies
        if: matrix.platform == 'linux' && matrix.appimage != true
        run: |
          sudo apt-get install -y ./dist-release/*.deb
          python scripts/release/verify_linux_install.py ${{ matrix.arch }}
          sudo apt-get remove -y modureader
          test ! -e /opt/modureader/modu
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.appimage && 'modu-linux-x64-appimage' || format('modu-{0}-{1}', matrix.platform, matrix.arch) }}
          path: |
            dist-release/*.dmg
            dist-release/*.exe
            dist-release/*.deb
            dist-release/*.AppImage
            dist-release/*.sha256
          if-no-files-found: error
          retention-days: 14

  linux_appimage_smoke:
    name: AppImage reader on ${{ matrix.distribution }}
    if: >-
      always() && !cancelled() &&
      (inputs.appimage_smoke_run_id ||
        (needs.targets.outputs.linux_appimage == 'true' && needs.desktop.result == 'success'))
    needs: [targets, desktop]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distribution: 'Ubuntu 24.04', runner: 'ubuntu-24.04', ubuntu_version: '24.04' }
          - { distribution: 'Ubuntu 26.04', runner: 'ubuntu-26.04', ubuntu_version: '26.04' }
          - { distribution: 'Arch Linux', runner: 'ubuntu-24.04', ubuntu_version: '' }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate prior workflow run ID
        if: inputs.appimage_smoke_run_id
        env:
          APPIMAGE_RUN_ID: ${{ inputs.appimage_smoke_run_id }}
        run: '[[ "$APPIMAGE_RUN_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: modu-linux-x64-appimage
          path: dist-release
          repository: ${{ github.repository }}
          run-id: ${{ inputs.appimage_smoke_run_id || github.run_id }}
          github-token: ${{ inputs.appimage_smoke_run_id && github.token || '' }}
      - name: Verify the single AppImage artifact
        working-directory: dist-release
        run: |
          shopt -s nullglob
          images=(*.AppImage)
          test "${#images[@]}" -eq 1
          sha256sum --strict --check "${images[0]}.sha256"
          sha256sum "${images[0]}"
          chmod +x "${images[0]}"
      - name: Install Ubuntu desktop runtime and test dependencies
        if: matrix.ubuntu_version
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap xdg-dbus-proxy gtk-update-icon-cache libgtk-3-0t64 \
            libepoxy0 libsecret-1-0 libsqlite3-0 libasound2t64 libpulse0 libwayland-server0 \
            libsoup-3.0-0 libavif16 libmanette-0.2-0 libenchant-2-2 libwoff1 \
            libharfbuzz-icu0 libgcrypt20 libtasn1-6 libjpeg-turbo8 libpng16-16t64 \
            liblcms2-2 libwebp7 libwebpdemux2 libopenjp2-7 libseccomp2 libgstreamer-plugins-bad1.0-0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good libgl1-mesa-dri \
            libegl-mesa0 libgles2 fonts-dejavu-core dbus-daemon xvfb xauth
      - name: Enable Ubuntu 24.04’s packaged Bubblewrap profile
        if: matrix.ubuntu_version == '24.04'
        run: |
          sudo apt-get install -y --no-install-recommends apparmor-profiles
          sudo cp -n /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo cmp /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser --skip-read-cache --replace /etc/apparmor.d/bwrap-userns-restrict
      - name: Verify EPUB and PDF on native Ubuntu with AppArmor enabled
        if: matrix.ubuntu_version
        env:
          EXPECTED_UBUNTU: ${{ matrix.ubuntu_version }}
        run: |
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = "$EXPECTED_UBUNTU"
          if [[ $(cat /sys/module/apparmor/parameters/enabled) != Y ||
                $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns) != 1 ]]; then
            echo "::error::Ubuntu validation requires AppArmor and its default user namespace restrictions"
            exit 1
          fi
          framebuffer_dir=$(mktemp -d)
          trap 'rm -rf "$framebuffer_dir"' EXIT
          dbus-run-session -- xvfb-run -a \
            -s "-screen 0 1280x800x24 -noreset -fbdir $framebuffer_dir" \
            python3 scripts/release/verify_linux_appimage.py \
            dist-release/*.AppImage "$framebuffer_dir/Xvfb_screen0"
      - name: Allow nested user namespaces for the Arch container
        if: '!matrix.ubuntu_version'
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Verify EPUB and PDF in Arch Linux
        if: '!matrix.ubuntu_version'
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            --volume "$PWD/dist-release:/packages:ro" \
            --volume "$PWD/scripts/release/verify_linux_appimage.py:/verify_linux_appimage.py:ro" \
            archlinux:base bash -euc '
              pacman -Syu --noconfirm --needed \
                gtk3 libepoxy libsecret sqlite bubblewrap xdg-dbus-proxy \
                libsoup3 libavif libmanette enchant woff2 harfbuzz-icu libgcrypt libtasn1 \
                libjpeg-turbo libpng lcms2 libwebp openjpeg2 libseccomp gst-plugins-bad-libs \
                gstreamer gst-plugins-base gst-plugins-good libpulse alsa-lib \
                python dbus xorg-server-xvfb xorg-xauth ttf-dejavu mesa libglvnd
              useradd --create-home smoke
              install -d /run/dbus
              dbus-uuidgen > /etc/machine-id
              dbus-daemon --system --fork --nopidfile
              cd /home/smoke
              install -m 755 /packages/*.AppImage ./Modu.AppImage
              framebuffer_dir=$(runuser -u smoke -- mktemp -d)
              runuser -u smoke -- dbus-run-session -- xvfb-run -a \
                -s "-screen 0 1280x800x24 -noreset -fbdir $framebuffer_dir" \
                python3 /verify_linux_appimage.py ./Modu.AppImage "$framebuffer_dir/Xvfb_screen0"
            '

  android:
    needs: [targets, models]
    if: needs.targets.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: embedding-test-fixtures
          path: build/model-test-fixtures
      - name: Verify separate instrumentation model fixtures
        run: python3 scripts/release/bundle_models.py --verify-only
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Prepare sources and Rust mobile targets
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          npm ci --prefix assets/foliate-js
          (cd assets/foliate-js && node node_modules/webpack-cli/bin/cli.js --config webpack.config.js)
      - name: Install XML-v4-capable Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: false
          packages: ''
      - name: Use the same SDK parser for the emulator runner
        # emulator-runner prepends cmdline-tools/latest, overriding PATH.
        run: |
          tools_root="$ANDROID_HOME/cmdline-tools"
          selected_tools="$(dirname "$(dirname "$(realpath "$(command -v sdkmanager)")")")"
          grep -qx 'Pkg.Revision=16.0' "$selected_tools/source.properties"
          if [[ ! -e "$tools_root/latest" || "$(realpath "$tools_root/latest")" != "$selected_tools" ]]; then
            if [[ -e "$tools_root/latest" || -L "$tools_root/latest" ]]; then
              test ! -e "$tools_root/modu-runner-original"
              test ! -L "$tools_root/modu-runner-original"
              mv "$tools_root/latest" "$tools_root/modu-runner-original"
            fi
            ln -s "$selected_tools" "$tools_root/latest"
          fi
          "$tools_root/latest/bin/sdkmanager" --version
      - name: Load dedicated release signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: node scripts/release/android-signing.mjs --from-env
      # x64 is built only for the emulator regression, never packaged/uploaded.
      - name: Build arm64 APK and internal x64 emulator fixture
        run: node scripts/build_android.mjs --target-platform android-arm64,android-x64
      - name: Verify signatures and package
        run: |
          python3 scripts/release/package.py android arm64
      - name: Build release instrumentation (never packaged in the app)
        run: cd android && ./gradlew app:assembleReleaseAndroidTest -Ptarget-platform=android-arm64,android-x64 -Psplit-per-abi=true
      - name: Enable emulator KVM in isolated runner
        run: sudo chmod 666 /dev/kvm
      - name: Test all four models against minified Android release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          heap-size: 1024M
          disable-animations: true
          script: |
            adb install build/app/outputs/flutter-apk/app-x86_64-release.apk
            adb install build/app/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell am instrument -w com.modu.reader.test/com.modu.reader.EmbeddingReleaseInstrumentation | tee /tmp/modu-release-inference.log
            grep -q 'MODU_RELEASE_INFERENCE_PASS models=4 runs=12' /tmp/modu-release-inference.log
      - uses: actions/upload-artifact@v4
        with:
          name: modu-android
          path: |
            dist-release/*-android-arm64.apk
            dist-release/*-android-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: [targets]
    if: needs.targets.outputs.ios == 'true'
    name: ios-arm64
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Prepare sources and Rust iOS target
        run: |
          rustup target add aarch64-apple-ios
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          npm ci --prefix assets/foliate-js
          (cd assets/foliate-js && node node_modules/webpack-cli/bin/cli.js --config webpack.config.js)
      - name: Build unsigned device application
        run: flutter build ios --release --no-codesign --build-name "$(python3 scripts/release/verify_mobile.py --apple-build-name)"
      - name: Package unsigned IPA (requires user's own signing)
        run: python3 scripts/release/package.py ios arm64
      - uses: actions/upload-artifact@v4
        with:
          name: modu-ios-arm64
          path: |
            dist-release/*.ipa
            dist-release/*.sha256
          if-no-files-found: error
          retention-days: 14

  harmony:
    needs: targets
    if: needs.targets.outputs.harmony == 'true'
    uses: ./.github/workflows/harmony-cloud.yml
    with:
      build_hap: true
    secrets:
      HARMONY_LINUX_TOOLS_URL: ${{ secrets.HARMONY_LINUX_TOOLS_URL }}

  release:
    if: >-
      always() && !cancelled() && !inputs.appimage_smoke_run_id &&
      (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') &&
      needs.quality.result == 'success' && needs.models.result == 'success' && needs.targets.result == 'success' &&
      (needs.targets.outputs.has_desktop != 'true' || needs.desktop.result == 'success') &&
      (needs.targets.outputs.linux_appimage != 'true' || needs.linux_appimage_smoke.result == 'success') &&
      (needs.targets.outputs.android != 'true' || needs.android.result == 'success') &&
      (needs.targets.outputs.ios != 'true' || needs.ios.result == 'success') &&
      (needs.targets.outputs.harmony != 'true' || needs.harmony.result == 'success')
    needs: [quality, models, targets, desktop, linux_appimage_smoke, android, ios, harmony]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: modu-*
          path: dist-release
          merge-multiple: true
      - name: Verify complete package set and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          RELEASE_COMMIT: ${{ github.sha }}
          CREATE_RELEASE_TAG: ${{ !startsWith(github.ref, 'refs/tags/') }}
          REPLACE_RELEASE: ${{ inputs.replace_release || false }}
          EXPECTED_TAG_COMMIT: ${{ inputs.expected_tag_commit }}
          RELEASE_TARGETS: ${{ inputs.targets || 'all' }}
        run: |
          expected_tag="v$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          test "$RELEASE_TAG" = "$expected_tag"
          python3 scripts/release/validate_assets.py dist-release "$RELEASE_TAG" --include-harmony --targets "$RELEASE_TARGETS"
          if [[ "$REPLACE_RELEASE" == "true" ]]; then
            test "$CREATE_RELEASE_TAG" = "true"
            [[ "$EXPECTED_TAG_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/modu-release-tag.json"
            python3 -c 'import json,os,sys; ref=json.load(open(sys.argv[1])); assert ref["object"]["type"] == "commit" and ref["object"]["sha"] in (os.environ["EXPECTED_TAG_COMMIT"],os.environ["RELEASE_COMMIT"]), "Existing release changed; refusing overwrite"' "$RUNNER_TEMP/modu-release-tag.json"
            # List successfully before deciding that a release is absent: API
            # errors must never be mistaken for a deleted release.
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/modu-releases.json"
            release_exists=$(python3 -c 'import json,os,sys; pages=json.load(open(sys.argv[1])); print("true" if any(r["tag_name"] == os.environ["RELEASE_TAG"] for page in pages for r in page) else "false")' "$RUNNER_TEMP/modu-releases.json")
            # Hide an existing release while replacing its source and assets.
            # This workflow token does not dispatch another tag-triggered build.
            if [[ "$release_exists" == "true" ]]; then
              gh release edit "$RELEASE_TAG" --draft
            fi
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT" -F force=true
            if [[ "$release_exists" == "false" ]]; then
              gh release create "$RELEASE_TAG" --verify-tag --draft --title "默读 $RELEASE_TAG · 正式版" --notes-file docs/RELEASE_NOTES.md
            fi
            gh release upload "$RELEASE_TAG" dist-release/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest --target "$RELEASE_COMMIT" --title "默读 $RELEASE_TAG · 正式版" --notes-file docs/RELEASE_NOTES.md
            exit 0
          fi
          if [[ "$CREATE_RELEASE_TAG" == "true" ]]; then
            # GitHub's workflow token creates the tag only after validation;
            # this does not dispatch another tag-triggered packaging run.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/modu-release-tag.json"; then
              python3 -c 'import json,os,sys; ref=json.load(open(sys.argv[1])); assert ref["object"]["type"] == "commit" and ref["object"]["sha"] == os.environ["RELEASE_COMMIT"], "Existing tag points to different source"' "$RUNNER_TEMP/modu-release-tag.json"
            else
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT"
            fi
          fi
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            gh release create "$RELEASE_TAG" dist-release/* --verify-tag --latest --title "默读 $RELEASE_TAG · 正式版" --notes-file docs/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" dist-release/* --verify-tag --prerelease --latest=false --title "默读 $RELEASE_TAG · Beta" --notes-file docs/RELEASE_NOTES.md
          fi


  notify-telegram:
    # Releases published with GITHUB_TOKEN do not trigger release workflows.
    needs: release
    if: needs.release.result == 'success'
    uses: ./.github/workflows/telegram-release.yml
    with:
      release_tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  notify-qq:
    # Publishing with GITHUB_TOKEN suppresses the release event, so call this directly.
    needs: release
    if: needs.release.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/qq-release.yml
    with:
      release_tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
