name: Modu QQ Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published tag to announce; latest selects the latest stable release'
        default: latest
        required: true
        type: string
      test_notice:
        description: 'Prefix the message as a test without marking the real release announced'
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: modu-qq-${{ github.event.release.tag_name || inputs.release_tag || 'latest' }}
  cancel-in-progress: false

jobs:
  announce:
    if: github.repository == 'sobranie2406/modureader'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/release/notify_qq.py
          sparse-checkout-cone-mode: false
      - name: Notify QQ after publication using a short-lived GitHub identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || 'latest' }}
          QQ_TEST_NOTICE: ${{ inputs.test_notice || false }}
        run: python3 scripts/release/notify_qq.py
