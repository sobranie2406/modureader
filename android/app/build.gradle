plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.modu.reader"
    // compileSdk flutter.compileSdkVersion
    compileSdk 36
    ndkVersion flutter.ndkVersion
    // Exercise the same minified code used by the published APK, not debug.
    testBuildType "release"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.modu.reader"
        minSdkVersion 26
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        targetSdkVersion 35
        testInstrumentationRunner "com.modu.reader.EmbeddingReleaseInstrumentation"
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias'] ?: System.getenv('MODU_ANDROID_KEY_ALIAS')
            keyPassword keystoreProperties['keyPassword'] ?: System.getenv('MODU_ANDROID_KEY_PASSWORD')
            def releaseStore = keystoreProperties['storeFile'] ?: System.getenv('MODU_ANDROID_KEYSTORE')
            storeFile releaseStore ? file(releaseStore) : null
            storePassword keystoreProperties['storePassword'] ?: System.getenv('MODU_ANDROID_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            // signingConfig signingConfigs.debug
            signingConfig signingConfigs.release
            proguardFiles 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abiVersionCode = 0
            if (output.getFilter(com.android.build.OutputFile.ABI) != null) {
                def abiName = output.getFilter(com.android.build.OutputFile.ABI)
                switch(abiName) {
                    case "armeabi-v7a":
                        abiVersionCode = 0 
                        break
                    case "arm64-v8a":
                        abiVersionCode = 0
                        break
                    case "x86":
                        abiVersionCode = 0
                        break
                    case "x86_64":
                        abiVersionCode = 0
                        break
                }
            }
            output.versionCodeOverride = flutterVersionCode.toInteger() + abiVersionCode
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.3'
}
