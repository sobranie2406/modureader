# Install as its own sites-enabled entry; leave existing proxy vhosts untouched.
limit_req_zone $server_name zone=modu_auth_global:1m rate=5r/s;
limit_conn_zone $server_name zone=modu_auth_concurrent:1m;

server {
    listen 443 ssl;
    server_name baidu-auth.2406.fun;
    ssl_certificate /etc/modu-baidu-auth/origin.pem;
    ssl_certificate_key /etc/modu-baidu-auth/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # OAuth callback URLs contain codes; never log requests in this vhost.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 10s;
    limit_req zone=modu_auth_global burst=10 nodelay;
    limit_req_status 429;
    limit_conn modu_auth_concurrent 16;
    limit_conn_status 429;
    # Cloudflare IPv4 ranges, verified 2026-11-08. DNS publishes only an A record.
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    deny all;

    location ~ ^/(v1/(start|claim|token|revoke)|oauth/baidu/callback)$ {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host baidu-auth.2406.fun;
        # Cloudflare overwrites X-Modu-Origin for this exact host; broker verifies it.
        proxy_set_header X-Modu-Origin $http_x_modu_origin;
        proxy_set_header X-Modu-Client-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 10s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location / { return 404; }
}
